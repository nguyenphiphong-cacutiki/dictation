name: CI

on:
  pull_request:
    branches: [develop, main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Security ──────────────────────────────────────────────────────────────

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full PR history so gitleaks sees all commits

      - name: Install gitleaks
        run: |
          curl --retry 5 --retry-connrefused --retry-delay 15 --max-time 120 -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --log-level warn

  backend-security:
    name: Security (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit — dependency CVE check
        run: |
          pip install pip-audit --quiet
          pip-audit -r backend/requirements.txt

      - name: Bandit — static security analysis
        run: |
          pip install bandit --quiet
          bandit -r backend/ -x backend/tests,backend/dist -ll

  frontend-audit:
    name: Audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: frontend

      - name: npm audit — dependency CVE check
        run: npm audit --audit-level=high
        working-directory: frontend

  terraform-security:
    name: Security (Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform
          minimum_severity: MEDIUM
          soft_fail: false

  # ── Quality ───────────────────────────────────────────────────────────────

  backend-lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff --quiet

      - run: ruff check backend/

  backend-test:
    name: Test (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pytest-cov PyJWT boto3 --quiet
        working-directory: backend

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing
        working-directory: backend

  frontend-lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

  frontend-test:
    name: Test (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npm test
        working-directory: frontend

  frontend-build:
    name: Build (Frontend)
    runs-on: ubuntu-latest
    needs: [frontend-test, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: /api

  terraform-fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Check formatting
        run: terraform fmt -check -recursive terraform/

  # ── Gate ──────────────────────────────────────────────────────────────────

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - secret-scan
      - backend-security
      - frontend-audit
      - terraform-security
      - backend-lint
      - backend-test
      - frontend-lint
      - frontend-test
      - frontend-build
      - terraform-fmt
    steps:
      - name: Report job statuses
        run: |
          echo "secret-scan        : ${{ needs.secret-scan.result }}"
          echo "backend-security   : ${{ needs.backend-security.result }}"
          echo "frontend-audit     : ${{ needs.frontend-audit.result }}"
          echo "terraform-security : ${{ needs.terraform-security.result }}"
          echo "backend-lint       : ${{ needs.backend-lint.result }}"
          echo "backend-test       : ${{ needs.backend-test.result }}"
          echo "frontend-lint      : ${{ needs.frontend-lint.result }}"
          echo "frontend-test      : ${{ needs.frontend-test.result }}"
          echo "frontend-build     : ${{ needs.frontend-build.result }}"
          echo "terraform-fmt      : ${{ needs.terraform-fmt.result }}"

      - name: Fail if any job did not succeed
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed or were cancelled."
          exit 1
